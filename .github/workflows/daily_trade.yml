name: Daily Automated Algo Trading Check

on:
  schedule:
    # 03:45 UTC = 09:15 AM IST (Market Open Check, Mon-Fri)
    - cron: '45 3 * * 1-5'
    # 10:00 UTC = 03:30 PM IST (Market Close Check, Mon-Fri)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub UI anytime

jobs:
  run-daily-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance plotly requests streamlit

      - name: Run Daily Risk & Stop-Loss Check
        run: |
          python paper_portfolio_tracker.py

      - name: Commit & Push Updated Portfolio State
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add paper_portfolio_state.json || true
          git commit -m "Auto-update paper portfolio state [skip ci]" || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
